name: MOONRIDE GO Passenger Android APK

on:
  push:
    branches:
      - go-passenger-flutter
  pull_request:
    branches:
      - "1.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-passenger-apk:
    name: Build Passenger APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: apps/passenger
        shell: bash
        run: |
          flutter create --platforms=android --org ge.moonride --project-name passenger /tmp/moonride-passenger-android
          cp -a /tmp/moonride-passenger-android/android ./android
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          content = settings.read_text()
          needle = "mavenCentral()"
          repo = 'maven(url = uri("https://artifactory.2gis.dev/sdk-maven-release"))'
          if repo not in content:
              if needle not in content:
                  raise SystemExit("Could not find mavenCentral() in generated Android settings.gradle.kts")
              content = content.replace(needle, needle + "\n        " + repo, 1)
              settings.write_text(content)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", permission + "\n    <application", 1)
          manifest.write_text(content)
          PY

      - name: Configure 2GIS key and verify
        working-directory: apps/passenger
        env:
          DGIS_SDK_KEY_BASE64: ${{ secrets.DGIS_SDK_KEY_BASE64 }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        shell: bash
        run: |
          if [ -n "${DGIS_SDK_KEY_BASE64:-}" ]; then
            if ! printf '%s' "$DGIS_SDK_KEY_BASE64" | base64 --decode > assets/dgissdk.key; then
              echo "::error::DGIS_SDK_KEY_BASE64 is not valid Base64."
              exit 1
            fi
            HAS_DGIS_KEY=true
          else
            echo "2GIS SDK key secret is not configured; map screen will show setup instructions."
            HAS_DGIS_KEY=false
          fi
          if [ -z "${TOMTOM_API_KEY:-}" ]; then
            echo "::warning::TOMTOM_API_KEY is not configured; TomTom address search and route quoting will remain unavailable."
          fi
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://ewdkhekztkzugrmsknay.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_bshUTophPUo2GGLjJCpe7w_vF_lzyol \
            --dart-define=HAS_DGIS_KEY=$HAS_DGIS_KEY \\
            --dart-define=TOMTOM_API_KEY="$TOMTOM_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonride-passenger-apk
          path: apps/passenger/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
