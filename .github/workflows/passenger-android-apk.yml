name: MOONRIDE GO Passenger Android APK

on:
  push:
    branches:
      - go-passenger-flutter
  pull_request:
    branches:
      - "1.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-passenger-apk:
    name: Build Passenger APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: apps/passenger
        shell: bash
        run: |
          flutter create --platforms=android --org ge.moonride --project-name passenger /tmp/moonride-passenger-android
          cp -a /tmp/moonride-passenger-android/android ./android
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", permission + "\n    <application", 1)
          manifest.write_text(content)
          PY

      - name: Configure TomTom key and verify
        working-directory: apps/passenger
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        shell: bash
        run: |
          if [ -z "${TOMTOM_API_KEY:-}" ]; then
            echo "::warning::TOMTOM_API_KEY is not configured; TomTom map tiles, address search and route quoting will remain unavailable."
          fi
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://ewdkhekztkzugrmsknay.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_bshUTophPUo2GGLjJCpe7w_v_fLzyol \
            --dart-define=TOMTOM_API_KEY="$TOMTOM_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonride-passenger-apk
          path: apps/passenger/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
