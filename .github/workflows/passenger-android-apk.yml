name: MOONRIDE GO Passenger Android APK

on:
  push:
    branches:
      - go-passenger-flutter
  pull_request:
    branches:
      - "1.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-passenger-apk:
    name: Build Passenger APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: apps/passenger
        shell: bash
        run: |
          flutter create --platforms=android --org ge.moonride --project-name passenger /tmp/moonride-passenger-android
          cp -a /tmp/moonride-passenger-android/android ./android
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", permission + "\n    <application", 1)
          # Deep-link callback for Supabase Google OAuth.
          if "ge.moonride.passenger" not in content:
              intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="ge.moonride.passenger" android:host="login-callback" />
                  </intent-filter>
              """
              marker = content.rfind("</activity>")
              if marker < 0:
                  raise SystemExit("MainActivity declaration not found in generated AndroidManifest.xml")
              content = content[:marker] + intent_filter + content[marker:]
          content = content.replace('android:label="passenger"', 'android:label="MoonrideGo"', 1)
          manifest.write_text(content)
          PY

      - name: Configure TomTom key and verify
        working-directory: apps/passenger
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY || secrets.VUE_APP_TOMTOM_API_KEY }}
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://ewdkhekztkzugrmsknay.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_bshUTophPUo2GGLjJCpe7w_vF_lzyol \
            --dart-define=TOMTOM_API_KEY="$TOMTOM_API_KEY"
          if [ -z "${TOMTOM_API_KEY:-}" ]; then
            echo "::error::TOMTOM_API_KEY repository secret is required. Compiled APK will not be published until the TomTom map is enabled."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonride-passenger-apk
          path: apps/passenger/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
