name: MOONRIDE GO Passenger Android APK
# Rebuild passenger on the unified STAFF GO three-app release commit.

on:
  push:
    branches:
      - go-passenger-flutter
      - work/day1-day2-hardening-2026-11-22
      - work/classic-blue-three-apps-2026-11-22
      - work/staff-go-2026-11-26
      - work/auth-rebuild-2026-11-26
    paths:
      - "apps/passenger/**"
      - "packages/moonride_core/**"
      - "supabase/functions/**"
      - ".github/workflows/passenger-android-apk.yml"
  pull_request:
    branches:
      - "1.0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonride-passenger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-passenger-apk:
    name: Build Passenger APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: apps/passenger
        shell: bash
        run: |
          flutter create --platforms=android --org ge.moonride --project-name passenger /tmp/moonride-passenger-android
          cp -a /tmp/moonride-passenger-android/android ./android
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", permission + "\n    <application", 1)
          # Deep-link callback for Supabase Google OAuth and password recovery.
          if "ge.moonride.passenger" not in content:
              intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="ge.moonride.passenger" android:host="login-callback" />
                  </intent-filter>
              """
              marker = content.rfind("</activity>")
              if marker < 0:
                  raise SystemExit("MainActivity declaration not found in generated AndroidManifest.xml")
              content = content[:marker] + intent_filter + content[marker:]
          content = content.replace('android:label="passenger"', 'android:label="MoonrideGo"', 1)
          manifest.write_text(content)
          PY

      - name: Install SVG renderer for shared app icon
        run: sudo apt-get install -y librsvg2-bin

      - name: Apply shared Classic Blue MOONRIDE icon
        run: |
          python3 scripts/android/apply_moonride_branding.py \
            apps/passenger/android/app/src/main/res \
            apps/passenger/android/app/src/main/AndroidManifest.xml \
            MoonrideGo

      - name: Install Flutter dependencies
        working-directory: apps/passenger
        run: flutter pub get

      - name: Analyze Passenger source
        working-directory: apps/passenger
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run Passenger tests
        working-directory: apps/passenger
        run: flutter test --no-pub

      - name: Verify TomTom key is configured
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY || secrets.VUE_APP_TOMTOM_API_KEY }}
        shell: bash
        run: |
          if [ -z "${TOMTOM_API_KEY:-}" ]; then
            echo "::error::TOMTOM_API_KEY repository secret is required. Configure it in GitHub Actions secrets; do not paste it into source code."
            exit 1
          fi
          echo "TomTom key is configured; value is hidden."

      - name: Build Passenger release APK
        working-directory: apps/passenger
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY || secrets.VUE_APP_TOMTOM_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk --release --target-platform android-arm \
            --dart-define=SUPABASE_URL=https://ewdkhekztkzugrmsknay.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_bshUTophPUo2GGLjJCpe7w_vF_lzyol \
            --dart-define=TOMTOM_API_KEY="$TOMTOM_API_KEY" \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonride-passenger-j8-apk
          path: apps/passenger/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
