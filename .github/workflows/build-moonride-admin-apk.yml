name: Build MoonrideADMIN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - moonride-flutter-apps
    paths:
      - "moonride_flutter/lib/**"
      - "moonride_flutter/pubspec.yaml"
      - ".github/workflows/build-moonride-admin-apk.yml"

jobs:
  build-admin:
    name: Build MoonrideADMIN debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Flutter project
        run: flutter create --platforms=android moonride_admin_build

      - name: Add MOONRIDE GO source and dependencies
        run: |
          cp moonride_flutter/lib/main.dart moonride_admin_build/lib/main.dart
          cd moonride_admin_build
          flutter pub add supabase_flutter geolocator

      - name: Configure admin package name and Android permissions
        run: |
          cd moonride_admin_build
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          insertion = '''android {
              flavorDimensions += "app"
              productFlavors {
                  create("admin") {
                      dimension = "app"
                      applicationId = "com.moonridego.admin"
                  }
              }
          '''
          if "flavorDimensions" not in source:
              if "android {" not in source:
                  raise SystemExit("Could not find Android Gradle configuration")
              source = source.replace("android {", insertion, 1)
              gradle.write_text(source)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          xml = xml.replace('android:label="moonride_admin_build"', 'android:label="MoonrideADMIN"')
          permissions = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\\n'
          )
          if "android.permission.INTERNET" not in xml:
              xml = xml.replace("<application", permissions + "    <application", 1)
          manifest.write_text(xml)
          PY

      - name: Build MoonrideADMIN installable debug APK
        run: |
          cd moonride_admin_build
          flutter build apk --debug --flavor admin --dart-define=APP_ROLE=master_admin --dart-define=APP_NAME=MoonrideADMIN
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-admin-debug.apk artifacts/MoonrideADMIN.apk
          test -s artifacts/MoonrideADMIN.apk

      - name: Upload MoonrideADMIN APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonrideADMIN-APK
          path: moonride_admin_build/artifacts/MoonrideADMIN.apk
          if-no-files-found: error
