name: MoonrideGo Passenger Android APK

on:
  push:
    branches:
      - moonride-go-passenger
      - tomtom-passenger-map
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-passenger-apk:
    runs-on: ubuntu-latest
    env:
      VUE_APP_SUPABASE_URL: ${{ secrets.VUE_APP_SUPABASE_URL }}
      VUE_APP_SUPABASE_ANON_KEY: ${{ secrets.VUE_APP_SUPABASE_ANON_KEY }}
      VUE_APP_TOMTOM_API_KEY: ${{ secrets.VUE_APP_TOMTOM_API_KEY }}
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - name: Check out passenger app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify TomTom key is available
        run: |
          if [ -z "$VUE_APP_TOMTOM_API_KEY" ]; then echo "::error::VUE_APP_TOMTOM_API_KEY is missing"; exit 1; fi
          echo "TomTom key is available; value is hidden."

      - name: Prepare MapLibre GL JS worker files for WebView
        run: |
          cp node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs public/maplibre-gl-worker.mjs
          cp node_modules/maplibre-gl/dist/maplibre-gl-shared.mjs public/maplibre-gl-shared.mjs
          test -s public/maplibre-gl-worker.mjs
          test -s public/maplibre-gl-shared.mjs

      - name: Build Passenger web app
        run: npm run build:passenger

      - name: Generate Android project
        run: npx cap add android

      - name: Add Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          marker = "    <application"
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]
          for permission in permissions:
              name = permission.split('name="')[1].split('"')[0]
              if name not in content:
                  if marker not in content:
                      raise SystemExit("AndroidManifest.xml application tag not found")
                  content = content.replace(marker, permission + "\n" + marker, 1)
          path.write_text(content)
          print("Android coarse and fine location permissions are present.")
          PY

      - name: Generate the MoonrideGo icon and splash assets
        run: |
          mkdir -p assets
          cp public/g-o-mark.svg assets/logo.svg
          npx --yes @capacitor/assets@4.0.0 generate --android --iconBackgroundColor "#07152B" --splashBackgroundColor "#07152B"

      - name: Copy web app and native assets
        run: npx cap sync android

      - name: Build installable Passenger APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/moonridego-passenger.apk

      - name: Upload Passenger APK
        uses: actions/upload-artifact@v4
        with:
          name: moonridego-passenger-apk
          path: release/moonridego-passenger.apk
          if-no-files-found: error
          retention-days: 14
