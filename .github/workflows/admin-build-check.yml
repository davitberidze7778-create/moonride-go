name: MOONRIDE GO Admin build check

on:
  push:
    branches:
      - moonride-go-admin
  pull_request:
    branches:
      - moonride-go-admin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm run build
