name: MOONRIDE GO Admin build check

on:
  push:
    branches:
      - moonride-go-admin
  pull_request:
    branches:
      - moonride-go-admin

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VUE_APP_SUPABASE_URL: ${{ secrets.VUE_APP_SUPABASE_URL }}
      VUE_APP_SUPABASE_ANON_KEY: ${{ secrets.VUE_APP_SUPABASE_ANON_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up compatible Node.js for legacy Vue CLI 4 / Webpack 4
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
      - name: Install dependencies
        run: npm install
      - name: Build web application
        run: npm run build
